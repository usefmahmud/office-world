# Agents Office World — v1 runtime (W2)
# engine is internal-only · web is the single published surface (BIND_HOST:WEB_PORT)

name: office-world

services:
  world-engine:
    build:
      context: ./apps/world-engine
    image: office-world-engine:dev
    container_name: world-engine
    environment:
      TICK: "${TICK:-2}"
      WORLD_SEED: "${WORLD_SEED:-7}"
      WORLD_STATE_DIR: /data
      WORLD_TOKEN: "${WORLD_TOKEN:-}"
    expose:
      - "8000"
    volumes:
      - world-data:/data
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  world-web:
    build:
      context: ./apps/world-web
    image: office-world-web:dev
    container_name: world-web
    depends_on:
      world-engine:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-8095}:80"
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  world-data:
